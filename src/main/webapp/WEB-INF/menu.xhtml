<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:f="jakarta.faces.core"
    xmlns:h="jakarta.faces.html"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="primefaces"
    xmlns:pv="http://primefaces.org/paradise">

    <div class="layout-menu-wrapper ">
        <div class="layout-menu-container">
            <h:form id="menuform">
                <div class="mobile-search">
                    <i class="pi pi-fw pi-search topbar-search-icon"></i>
                    <input type="text" class="topbar-search" placeholder="Type your search here"/>
                </div>
                <!--pv:menu widgetVar="ParadiseMenuWidget" model="#{sessionView.model}">
                </pv:menu-->
                <pv:menu widgetVar="ParadiseMenuWidget">
                    <p:submenu id="m_homepage" label="Favoritos" icon="pi pi-home">
                        <p:menuitem id="m_dashboard" value="Dashboard" icon="pi pi-home" outcome="/app/dashboard"
                                    rendered="#{sessionView.emisorRol}"
                                    process="@this"/>
                    </p:submenu>
                    <p:submenu label="Operaciones" icon="pi pi-fw pi-prime" >
                        <p:menuitem value="Factura" icon="pi pi-inbox" outcome="/app/process/invoce/invoce"
                                    rendered="#{sessionView.emisorRol}"
                                    process="@this"/>
                        <p:menuitem value="DTE's" icon="pi pi-list" outcome="/app/lstDtes"
                                    rendered="#{sessionView.emisorRol}"
                                    process="@this"/>
                        <p:menuitem value="Anulaciones" icon="pi pi-ban" outcome="/app/process/invalidate/invalidate" process="@this" rendered="false"/>
                        <p:menuitem value="Ingreso de compras" icon="pi pi-shopping-bag"
                                    rendered="#{sessionView.emisorRol}"
                                    process="@this" outcome="/app/process/shopping/buy"/>
                        <p:menuitem value="Reporte de Ventas" icon="pi pi-file-excel"
                                    rendered="#{sessionView.emisorRol}"
                                    process="@this" outcome="/app/process/sales/sales"/>
                        <p:menuitem value="Ingreso de compras" icon="pi pi-shopping-bag"
                                    rendered="#{sessionView.contadorRol}"
                                    process="@this" outcome="/app/process/shopping/buyContri"/>
                    </p:submenu>
                    <p:submenu label="Mantenimientos" icon="pi pi-home" rendered="#{sessionView.emisorRol}">
                        <p:menuitem value="Items" id="manttoCli" icon="pi pi-th-large" outcome="/app/mantto/items" process="@this"/>
                        <p:menuitem value="Mis Datos" icon="pi pi-briefcase" outcome="/app/mantto/emisor/emisor" process="@this" />
                        <p:menuitem value="Clientes" icon="pi pi-id-card" outcome="/app/mantto/cliente" process="@this" />
                    </p:submenu>
                </pv:menu>
            </h:form>
        </div>
    </div>

</ui:composition>
