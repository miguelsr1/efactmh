<ui:component xmlns="http://www.w3.org/1999/xhtml"
              xmlns:h="http://java.sun.com/jsf/html"
              xmlns:f="http://java.sun.com/jsf/core"
              xmlns:ui="http://java.sun.com/jsf/facelets"
              xmlns:p="http://primefaces.org/ui"
              xmlns:jsf="http://xmlns.jcp.org/jsf">

    <p:outputPanel id="dvClient" style="display: #{invoceView.activeStep eq 0? 'block':'none'}">
        <div class="ui-fluid formgrid grid" jsf:id="dvCliente">
            <div class="field col-12">
                <p:outputLabel for="cboDte" value="Tipo de documento"/>
                <p:selectOneMenu id="cboDte" value="#{invoceView.invoce.codigoDte}" required="true"
                                 requiredMessage="ES NECESARIO SELECCIONAR UN TIPO DE DTE">
                    <f:selectItem itemLabel="SELECCIONE UN DTE" noSelectionOption="true"/>
                    <f:selectItem itemValue="01" itemLabel="FACTURA"/>
                    <f:selectItem itemValue="03" itemLabel="CREDITO FISCAL"/>
                    <f:selectItem itemValue="14" itemLabel="SUJETO EXCLUIDO"/>
                    <p:ajax process="@this,cboDte" update="dvCliente"/>
                </p:selectOneMenu>
            </div>
            <div class="field col-12">
                <p:outputLabel for="txtFecha" value="Fecha de factura"/>
                <p:datePicker id="txtFecha" value="#{invoceView.dateInvoce}" hourFormat="24"
                              pattern="dd/MM/yyyy HH:mm:ss" showTime="true" required="true"
                              maxdate="#{invoceView.dateInvoce}"/>
            </div>

            <div class="field col-12" style="display:#{invoceView.existClient?'block':'none'}">
                <p:outputLabel for="txtNumDoc" value="Buscar cliente (DUI o NOMBRE)"/>
                <p:autoComplete id="txtNumDoc" value="#{invoceView.cliente}" minQueryLength="4"
                                completeMethod="#{invoceView.completeClient}"
                                var="client" itemLabel="#{client.nombreCompleto}#{client.razonSocial}"
                                itemValue="#{client}" showEmptyMessage="false"
                                converter="clientConverter" forceSelection="true" scrollHeight="250">
                    <p:ajax event="itemSelect" listener="#{invoceView.onItemSelect}" update="txtNumDoc"/>
                </p:autoComplete>
            </div>

            <!-- BLOQUE SIN DATOS PERO CON FACTURA NOMBRE -->
            <div class="field col-12 md:col-4" style="display:#{invoceView.requiereFactura?'block':'none'}">
                <p:outputLabel for="txtNomReq" value="Nombre cliente"/>
                <p:inputText id="txtNomReq" value="#{invoceView.nombreClienteReq}"
                             required="#{invoceView.requiereFactura}"
                             disabled="#{invoceView.invoce.codigoDte ne '01'}"
                             requiredMessage="DEBE DE INGRESAR EL NOMBRE DEL CLIENTE"/>
            </div>
            <div class="field col-12 md:col-4" style="display:#{invoceView.requiereFactura?'block':'none'}">
                <p:outputLabel for="txtCorreoReq" value="Correo electrónico"/>
                <p:inputText id="txtCorreoReq" value="#{invoceView.correoClienteReq}"
                             required="#{invoceView.requiereFactura}"
                             disabled="#{invoceView.invoce.codigoDte ne '01'}"
                             validatorMessage="FORMATO DE CORREO NO VALIDO"
                             requiredMessage="DEBE DE INGRESAR EL CORREO DEL CLIENTE">
                    <f:validateRegex
                            pattern="^[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$"/>
                </p:inputText>
            </div>
            <div class="field col-12" style="display:#{invoceView.existClient?'none':'block'}">
                <p:panel header="DATOS DE CLIENTE" toggleable="true" toggleableHeader="true" closable="true"
                         toggleSpeed="500"
                         closeSpeed="500" widgetVar="pnlDataClient">

                    <div class="grid">
                        <div class="field col-12">
                            <p:outputLabel for="cboTipoPer" value="Tipo de Personeria"/>
                            <p:selectOneMenu id="cboTipoPer" value="#{clienteView.tipoPersoneria}"
                                             disabled="#{clienteView.disabled or clienteView.edit}" class="w-full">
                                <f:selectItem itemValue="1" itemLabel="PERSONERIA NATURAL"/>
                                <f:selectItem itemValue="2" itemLabel="PERSONERIA JURIDICA"/>
                                <p:ajax update="dvDatos" listener="#{clienteView.iniciarClient}"/>
                            </p:selectOneMenu>
                        </div>
                        <div class="col-12" jsf:id="dvPn"
                             style="display: #{clienteView.tipoPersoneria eq 1 ? 'block' : 'none'}">
                            <p:outputPanel rendered="#{clienteView.tipoPersoneria eq 1}">
                                <ui:include src="../../../mantto/cliente/frag-pn.xhtml"/>
                            </p:outputPanel>
                        </div>

                        <div class="col-12" jsf:id="dvPj"
                             style="display: #{clienteView.tipoPersoneria eq 2 ? 'block' : 'none'}">
                            <p:outputPanel rendered="#{clienteView.tipoPersoneria eq 2}">
                                <ui:include src="../../../mantto/cliente/frag-pj.xhtml"/>
                            </p:outputPanel>
                        </div>
                    </div>

                    <f:facet name="options">
                        <p:menu>
                            <p:submenu label="Settings">
                                <p:menuitem value="Toggle" url="#" icon="pi pi-clone"
                                            onclick="PF('pnlDataClient').toggle()"/>
                                <p:menuitem value="Remove" url="#" icon="pi pi-times"
                                            onclick="PF('pnlDataClient').close()"/>
                            </p:submenu>
                        </p:menu>
                    </f:facet>
                </p:panel>
            </div>

            <div class="field col-2" style="margin-top: 1rem">
                <p:selectBooleanCheckbox id="bchIva" itemLabel="Retención IVA"
                                         value="#{invoceView.invoce.aplicaIvaRetenido}">
                    <p:ajax process="bchIva"/>
                </p:selectBooleanCheckbox>
            </div>
            <div class="col-10"
                 style="display: #{invoceView.invoce.codigoDte eq '03' ? 'block': 'none'}; margin-top: 1rem">
                <p:selectBooleanCheckbox id="bchRenta" itemLabel="Retención ISR"
                                         value="#{invoceView.invoce.aplicaRentaRetenido}">
                    <p:ajax process="bchRenta"/>
                </p:selectBooleanCheckbox>
            </div>
        </div>

        <p:commandButton value="Atras" styleClass="mr-2 ui-button-flat ui-button-secondary"
                         icon="pi pi-angle-left" disabled="#{invoceView.activeStep eq 0}"/>
        <p:commandButton value="Continuar" styleClass="mr-2 ui-button-primary"
                         update="step, dvClient, dvDetInvoce, dvDetPayment"
                         icon="pi pi-angle-right"
                         process="@this,cboDte,txtNumDoc,nomRec,txtFecha,txtNomReq,txtCorreoReq"
                         action="#{invoceView.nextStep()}"/>
    </p:outputPanel>

    <p:confirmDialog id="dglNewClient" widgetVar="dglNewClient"
                     message="EL CLIENTE INGRESADO NO EXISTE, ¿DESEA CREAR EL REGISTRO?"
                     header="INFORMACIÓN"
                     severity="alert">
        <p:commandButton value="SI"
                         update="dvCliente"
                         process="@this,dvCliente"
                         oncomplete="PF('dglNewClient').hide()"/>
        <p:commandButton value="NO" onclick="PF('dglNewClient').hide();"
                         styleClass="ui-button-flat"
                         type="button"/>
    </p:confirmDialog>

</ui:component>
