<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces"
                xmlns:jsf="jakarta.faces"
                template="/WEB-INF/template.xhtml">

    <ui:define name="title">Compras</ui:define>
    <ui:define name="head">
        <h:outputScript name="fn.js" library="js"/>
    </ui:define>

    <ui:define name="content">
        <h:form prependId="false">
            <div class="grid dashboard ">
                <div class="col-12">
                    <p:messages showDetail="true" showSummary="false" closable="true">
                        <p:autoUpdate/>
                    </p:messages>
                    <div class="card">
                        <h5>Listado de COMPRAS</h5>
                        <div class="grid">
                            <div class="col-12 md:col-12" jsf:id="dvDatos">
                                <div class="formgrid grid ui-fluid overflow-hidden transition-all duration-500 ease-in-out">
                                    <div class="field col-12">
                                        <p:outputLabel for="month" value="Año Fiscal" class="mr-2"/> <br/>
                                        <p:datePicker id="month" view="month" pattern="MM/yyyy"
                                                      value="#{buyView.buyDate}" required="true"
                                                      requiredMessage="ES REQUERIDO MES Y AÑO DE LA COMPRA"
                                                      yearNavigator="true" style="width: 10rem"
                                                      yearRange="2025:2027">
                                            <p:ajax event="dateSelect" listener="#{buyView.onDateSelect}"
                                                    update="tblPro dvDatos btnCsv btnAdd"/>
                                        </p:datePicker>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <p:panel visible="false">
                            <p:fileUpload id="upload" value="#{buyView.file}" label="" mode="simple" skinSimple="true"
                                          auto="true" process="@this" update="tblPro"
                                          listener="#{buyView.handleFileUpload}"
                                          allowTypes="/(\.|\/)(json)$/"/>
                        </p:panel>
                    </div>
                </div>
            </div>

            <div class="card">
                <p:toolbar>
                    <p:toolbarGroup>
                        <p:commandButton id="btnCsv" value="Descargar CSV" icon="pi pi-file-excel"
                                         styleClass="ui-button-help" ajax="false"
                                         disabled="#{buyView.fecha eq null}">
                            <p:fileDownload value="#{buyView.fileCsv}"/>
                        </p:commandButton>
                    </p:toolbarGroup>
                    <p:toolbarGroup align="right">

                        <p:commandButton id="btnAdd" icon="pi pi-plus" onclick="PF('dlgTipoCompra').show();"
                                         value="AGREGAR" styleClass="ui-button-success" type="button"
                                         disabled="#{buyView.fecha eq null}"/>
                    </p:toolbarGroup>
                </p:toolbar>

                <p:dataTable id="tblPro" widgetVar="tblPro" value="#{buyView.lstBuys}" var="buy"
                             rowKey="#{buy.codigoGeneracion}"
                             rowIndexVar="rowId" selectionMode="single"
                             allowUnsorting="true" sortMode="single"
                             styleClass="ui-datatable-striped ui-datatable-sm"
                             reflow="true" size="small" tableStyle="table-layout: auto;"
                             emptyMessage="NO SE HAN REGISTRADO COMPRAS"
                             paginator="true" paginatorPosition="bottom" rows="10">

                    <f:facet name="header">
                        <div class="flex justify-content-between align-items-center">
                            <h5><span style="margin-right: 1rem"></span>Listado de Items</h5>

                            <div>
                                <p:inputText id="globalFilter" onkeyup="PF('tblPro').filter()" style="width:20rem"
                                             placeholder="Buscar por Código o Nombre"/>
                            </div>
                        </div>
                    </f:facet>

                    <p:ajax event="rowSelect" update="dvDatos"/>

                    <p:column headerText="Código generaciónn">
                        <p:outputLabel value="#{buy.codigoGeneracion}"/>
                    </p:column>
                    <p:column headerText="Fecha compra">
                        <p:outputLabel value="#{buy.fecha}"/>
                    </p:column>
                    <p:column headerText="NIT Emisor">
                        <p:outputLabel value="#{buy.nit}"/>
                    </p:column>
                    <p:column headerText="Nombre Emisor">
                        <p:outputLabel value="#{buy.nombre}"/>
                    </p:column>
                    <p:column headerText="Monto compra">
                        <p:outputLabel value="#{buy.monto}">
                            <f:convertNumber pattern="#,##0.00"/>
                        </p:outputLabel>
                    </p:column>
                    <p:column headerText="Fecha registro">
                        <p:outputLabel value="#{buy.fechacrea}">
                            <f:convertDateTime pattern="yyyy-MM-dd"/>
                        </p:outputLabel>
                    </p:column>

                </p:dataTable>
            </div>

            <p:dialog id="dlgTipoCompra" widgetVar="dlgTipoCompra" header="Tipo de Compra" modal="true" visible="false"
                      responsive="true" width="400" closable="true" draggable="false" maximizable="false" minimizable="false">
                <div class="grid justify-content-center">
                    <div class="col-12 md:col-6 text-center">
                        <p:commandButton value="Costos" icon="pi pi-sync" styleClass="ui-button-outlined w-full p-3"
                                         onclick="PF('dlgTipoCompra').hide(); onClick('upload_input');" type="button" />
                    </div>
                    <div class="col-12 md:col-6 text-center">
                        <p:commandButton value="Gastos" icon="pi pi-wallet" styleClass="ui-button-outlined ui-button-secondary w-full p-3"
                                         onclick="PF('dlgTipoCompra').hide(); onClick('upload_input');" type="button" />
                    </div>
                </div>
            </p:dialog>

            <p:dialog id="dlgAddBuy" widgetVar="dlgAddBuy" header="Detalle de compra" modal="true" visible="false"
                      responsive="true"
                      width="380"
                      closable="false" draggable="false" maximizable="false" minimizable="false">
                <div class="grid">
                    <div class="col-12 md:col-12" jsf:id="dvDetailBuy">
                        <div class="formgrid grid ui-fluid overflow-hidden transition-all duration-500 ease-in-out">
                            <div class="field col-12">
                                <p:outputLabel value="Tipo de DTE:" styleClass="mr-2"/><br/>
                                <p:outputLabel value="#{buyView.nombreDte}" style="font-weight: bold"/>
                            </div>
                            <div class="field col-12">
                                <p:outputLabel value="Código generación:" styleClass="mr-2"/><br/>
                                <p:outputLabel value="#{buyView.codigoGeneracion}" style="font-weight: bold"/>
                            </div>
                            <div class="field col-12">
                                <p:outputLabel value="Fecha compra:" styleClass="mr-2"/><br/>
                                <p:outputLabel value="#{buyView.fechEmi}" style="font-weight: bold"/>
                            </div>
                            <div class="field col-12">
                                <p:outputLabel value="NIT Emisor:" styleClass="mr-2"/><br/>
                                <p:outputLabel value="#{buyView.nitEmisor}" style="font-weight: bold"/>
                            </div>
                            <div class="field col-12">
                                <p:outputLabel value="Nombre Emisor:" styleClass="mr-2"/><br/>
                                <p:outputLabel value="#{buyView.nombreEmisor}" style="font-weight: bold"/>
                            </div>
                            <div class="field col-12">
                                <p:outputLabel value="Monto de compra:" styleClass="mr-2"/><br/>
                                <p:outputLabel value="#{buyView.monto}" style="font-weight: bold">
                                    <f:convertNumber pattern="$ #,##0.00"/>
                                </p:outputLabel>
                            </div>
                            <div class="field col-12">
                                <p:outputLabel value="Clasificación de la compra:" styleClass="mr-2"/><br/>
                                <h:panelGroup styleClass="ui-inputgroup">
                                    <h:panelGroup id="icon" styleClass="ui-inputgroup-addon">
                                        <i class="pi pi-#{buyView.iconCost}"/>
                                    </h:panelGroup>

                                    <p:selectOneMenu id="selectOneMenuIcon" value="#{buyView.idCostClassification}"
                                                     var="item">
                                        <f:selectItems value="#{buyView.lstCost}" var="item"
                                                       itemLabel="#{item.name}"
                                                       itemValue="#{item.id}"/>
                                        <p:column><i class="pi pi-#{item.icon}"/> #{item.name} </p:column>

                                        <p:ajax update="@parent:@parent:icon"/>
                                    </p:selectOneMenu>

                                </h:panelGroup>
                            </div>
                        </div>
                    </div>
                </div>
                <f:facet name="footer">
                    <p:commandButton value="Cancelar" styleClass="ui-button-flat" onclick="PF('dlgAddBuy').hide();"
                                     process="@this"/>
                    <p:commandButton value="Aceptar" process="@this" action="#{buyView.guardarJson()}"/>
                </f:facet>
            </p:dialog>
        </h:form>
    </ui:define>
</ui:composition>
