<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces"
                xmlns:jsf="jakarta.faces"
                template="/WEB-INF/template.xhtml">

    <ui:define name="title">Compras</ui:define>
    <ui:define name="head">
        <h:outputScript name="fn.js" library="js"/>
    </ui:define>

    <ui:define name="content">   
        <h:form prependId="false">
            <div class="grid dashboard ">
                <div class="col-12">
                    <p:messages showDetail="true" showSummary="false" closable="true">
                        <p:autoUpdate />
                    </p:messages>
                    <div class="card">
                        <h5>Listado de COMPRAS</h5>
                        <div class="grid">
                            <div class="col-12 md:col-12" jsf:id="dvDatos">
                                <div class="formgrid grid ui-fluid overflow-hidden transition-all duration-500 ease-in-out">
                                    <div class="field col-12 md:col-3" >
                                        <p:outputLabel for="cboTipoDoc" value="Tipo de Documento"/>
                                        <p:selectOneMenu id="cboTipoDoc" value="#{buyContriView.idTipoDocumento}" class="w-full">
                                            <f:selectItem itemLabel="DUI" itemValue="13"/>
                                            <f:selectItem itemLabel="NIT" itemValue="36"/>
                                            <p:ajax update="lblNumDoc,txtNumDoc"/>
                                        </p:selectOneMenu>
                                    </div>
                                    <div class="field col-12 md:col-3" >
                                        <p:outputLabel id="lblNumDoc" for="txtNumDoc"
                                                       value="Número de Documento (max. #{buyContriView.maxNumDoc} caracteres)"/>
                                        <p:inputText id="txtNumDoc" value="#{buyContriView.numeroDocumento}"
                                                     maxlength="#{buyContriView.maxNumDoc}"
                                                     required="true" class="w-full"/>
                                    </div>
                                    <div class="field col-12" >
                                        <p:outputLabel for="month" value="Año Fiscal" class="mr-2"/> <br/>
                                        <p:datePicker id="month" view="month" pattern="MM/yyyy"
                                                      value="#{buyContriView.buyDate}" required="true"
                                                      requiredMessage="ES REQUERIDO MES Y AÑO DE LA COMPRA"
                                                      yearNavigator="true" style="width: 10rem"
                                                      yearRange="2025:2027">
                                            <p:ajax event="dateSelect" listener="#{buyContriView.onDateSelect}" update="tblPro dvDatos btnCsv" process="@this,cboTipoDoc,txtNumDoc,month" />
                                        </p:datePicker>
                                    </div>

                                    <div class="field col-12" >
                                        <p:outputLabel value="Seleccione el archivo JSON" class="mr-2"/> 
                                        <p:commandButton icon="pi pi-plus" onclick="onClick('upload_input')" disabled="#{buyContriView.fecha eq null}" />
                                    </div>
                                </div>
                            </div>
                        </div>

                        <p:panel visible="false">
                            <p:fileUpload id="upload" value="#{buyContriView.file}" label="" mode="simple" skinSimple="true"
                                          auto="true" process="@this" update="tblPro"
                                          listener="#{buyContriView.handleFileUpload}"
                                          allowTypes="/(\.|\/)(json)$/"/>
                        </p:panel>

                        <div class="field col-12">
                            <p:commandButton id="btnCsv" value="Descargar CSV" icon="pi pi-file-excel"
                                             styleClass="ui-button-help" ajax="false"
                                             disabled="#{buyContriView.fecha eq null}">
                                <p:fileDownload value="#{buyContriView.fileCsv}" />
                            </p:commandButton>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <p:dataTable id="tblPro" widgetVar="tblPro" value="#{buyContriView.lstBuys}" var="buy"
                             rowKey="#{buy.codigoGeneracion}"
                             rowIndexVar="rowId" selectionMode="single"
                             allowUnsorting="true" sortMode="single"
                             styleClass="ui-datatable-striped ui-datatable-sm"
                             reflow="true" size="small" tableStyle="table-layout: auto;"
                             emptyMessage="NO SE HAN REGISTRADO COMPRAS"
                             paginator="true" paginatorPosition="bottom" rows="10" >

                    <f:facet name="header">
                        <div class="flex justify-content-between align-items-center">
                            <h5><span style="margin-right: 1rem"></span>Listado de Items</h5>

                            <div>                            
                                <p:inputText id="globalFilter" onkeyup="PF('tblPro').filter()" style="width:20rem"
                                             placeholder="Buscar por Código o Nombre" />
                            </div>
                        </div>
                    </f:facet>

                    <p:ajax event="rowSelect" update="dvDatos" />

                    <p:column headerText="Código generaciónn" >
                        <p:outputLabel value="#{buy.codigoGeneracion}"/>
                    </p:column>
                    <p:column headerText="Fecha compra" >
                        <p:outputLabel value="#{buy.fecha}"/>
                    </p:column>
                    <p:column headerText="NIT Emisor" >
                        <p:outputLabel value="#{buy.nit}"/>
                    </p:column>
                    <p:column headerText="Nombre Emisor" filterMatchMode="contains" filterBy="#{buy.nombre}" >
                        <p:outputLabel value="#{buy.nombre}"/>
                    </p:column>
                    <p:column headerText="Monto compra" >
                        <p:outputLabel value="#{buy.monto}">
                            <f:convertNumber pattern="#,##0.00"/>
                        </p:outputLabel>
                    </p:column>
                    <p:column headerText="Fecha registro" >
                        <p:outputLabel value="#{buy.fechacrea}">
                            <f:convertDateTime pattern="yyyy-MM-dd"/>
                        </p:outputLabel>
                    </p:column>

                </p:dataTable>
            </div>

            <p:dialog id="dlgAddBuy" widgetVar="dlgAddBuy" header="Detalle de compra" modal="true" visible="false" responsive="true" 
                      width="380"
                      closable="false" draggable="false" maximizable="false" minimizable="false">
                <div class="grid">
                    <div class="col-12 md:col-12" jsf:id="dvDetailBuy">
                        <div class="formgrid grid ui-fluid overflow-hidden transition-all duration-500 ease-in-out">
                            <div class="field col-12" >
                                <p:outputLabel value="Tipo de DTE:" styleClass="mr-2" /><br/>
                                <p:outputLabel value="#{buyContriView.nombreDte}" style="font-weight: bold" />
                            </div>
                            <div class="field col-12" >
                                <p:outputLabel value="Código generación:" styleClass="mr-2" /><br/>
                                <p:outputLabel value="#{buyContriView.codigoGeneracion}" style="font-weight: bold" />
                            </div>
                            <div class="field col-12" >
                                <p:outputLabel value="Fecha compra:" styleClass="mr-2"/><br/>
                                <p:outputLabel value="#{buyContriView.fechEmi}" style="font-weight: bold" />
                            </div>
                            <div class="field col-12" >
                                <p:outputLabel value="NIT Emisor:" styleClass="mr-2"/><br/>
                                <p:outputLabel value="#{buyContriView.nitEmisor}" style="font-weight: bold" />
                            </div>
                            <div class="field col-12" >
                                <p:outputLabel value="Nombre Emisor:" styleClass="mr-2"/><br/>
                                <p:outputLabel value="#{buyContriView.nombreEmisor}" style="font-weight: bold" />
                            </div>
                            <div class="field col-12" >
                                <p:outputLabel value="Monto de compra:" styleClass="mr-2"/><br/>
                                <p:outputLabel value="#{buyContriView.monto}" style="font-weight: bold">
                                    <f:convertNumber pattern="$ #,##0.00" />
                                </p:outputLabel>
                            </div>
                        </div>
                    </div>
                </div>
                <f:facet name="footer">
                    <p:commandButton value="Cancelar" styleClass="ui-button-flat" onclick="PF('dlgAddBuy').hide();" process="@this"/>
                    <p:commandButton value="Aceptar" process="@this" action="#{buyContriView.guardarJson()}" update="tblPro"/>
                </f:facet>
            </p:dialog>
        </h:form>
    </ui:define>
</ui:composition>
