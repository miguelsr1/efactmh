<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces"
                xmlns:jsf="jakarta.faces"
                template="/WEB-INF/template.xhtml">

    <ui:define name="title">Nueva Compra</ui:define>
    <ui:define name="head">
        <h:outputScript name="fn.js" library="js"/>
        <style>
            .ui-fileupload-content {
                min-height: 150px;
                display: flex;
                align-items: center;
                justify-content: center;
                border: 2px dashed #d1d5db !important;
                border-radius: 6px;
                background-color: #f8fafc;
                margin-top: 10px;
                padding: 2rem !important;
            }
            .ui-fileupload-content.ui-state-drag {
                background-color: #e0e7ff;
                border-color: #6366f1 !important;
            }
            .ui-fileupload-buttonbar {
                background: transparent !important;
                border: none !important;
                padding: 0 !important;
            }
        </style>
    </ui:define>

    <ui:define name="content">
        <h:form prependId="false" enctype="multipart/form-data">
            <p:messages id="msg" showDetail="true" showSummary="false" closable="true">
                <p:autoUpdate/>
            </p:messages>

            <div class="grid dashboard">
                <!-- Panel de Configuración (Izquierda) -->
                <div class="col-12 md:col-4">
                    <div class="card h-full">
                        <h5><i class="pi pi-cog mr-2"></i>Configuración de Compra</h5>
                        <p class="text-secondary mb-4">Seleccione el periodo y el tipo de clasificación antes de cargar los archivos.</p>

                        <div class="formgrid grid ui-fluid">
                            <div class="field col-12 md:col-6">
                                <p:outputLabel for="year" value="Año" styleClass="font-bold"/>
                                <p:selectOneMenu id="year" value="#{buyView.currentYear}" required="true">
                                    <f:selectItems value="#{buyView.buyService.lstAnios}" var="anio" itemLabel="#{anio.nombre}" itemValue="#{anio.id}"/>
                                    <p:ajax listener="#{buyView.onMonthSelect}" update="tblPro panelUpload"/>
                                </p:selectOneMenu>
                            </div>
                            <div class="field col-12 md:col-6">
                                <p:outputLabel for="month" value="Mes" styleClass="font-bold"/>
                                <p:selectOneMenu id="month" value="#{buyView.selectedMonth}" required="true" requiredMessage="Debe seleccionar un mes">
                                    <f:selectItem itemLabel="Seleccione" itemValue="#{null}" noSelectionOption="true"/>
                                    <f:selectItems value="#{buyView.buyService.lstMeses}" var="mes" itemLabel="#{mes.nombre}" itemValue="#{mes.id}"/>
                                    <p:ajax listener="#{buyView.onMonthSelect}" update="tblPro panelUpload"/>
                                </p:selectOneMenu>
                            </div>

                            <div class="field col-12 mt-3">
                                <p:outputLabel value="Clasificación de la Compra" styleClass="font-bold"/>
                                <p:selectOneButton id="btnTipoCompra" value="#{buyView.idCostClassification}" styleClass="w-full mt-2">
                                    <f:selectItems value="#{buyView.buyService.lstCost}" var="cost" itemLabel="#{cost.name}" itemValue="#{cost.id}"/>
                                    <p:ajax process="@this" oncomplete="PF('fileUploadWidget').clear();" />
                                </p:selectOneButton>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Panel de Carga de Archivos (Derecha) -->
                <div class="col-12 md:col-8">
                    <div class="card h-full" jsf:id="panelUpload">
                        <h5><i class="pi pi-cloud-upload mr-2"></i>Carga de Archivos JSON</h5>
                        <p class="text-secondary mb-4">Arrastre y suelte sus archivos JSON en el área designada.</p>

                        <!-- FileUpload en modo avanzado con Drag and Drop, NO automático -->
                        <p:fileUpload widgetVar="fileUploadWidget" id="fileUpload" listener="#{buyView.handleFileUpload}" mode="advanced"
                                      dragDropSupport="true" multiple="true"
                                      update="msg tblPro" auto="false"
                                      fileLimit="20"
                                      allowTypes="/(\.|\/)(json)$/"
                                      label="Elegir Archivos" uploadLabel="Subir y Procesar" cancelLabel="Cancelar"
                                      invalidFileMessage="Tipo de archivo inválido. Solo se permiten archivos .json"
                                      disabled="#{buyView.selectedMonth eq null}"/>
                    </div>
                </div>

                <!-- Panel de Tabla (Inferior) -->
                <div class="col-12">
                    <div class="card">
                        <p:dataTable id="tblPro" widgetVar="tblPro" value="#{buyView.lstBuys}" var="buy"
                                     rowKey="#{buy.codigoGeneracion}"
                                     emptyMessage="NO SE HAN CARGADO COMPRAS EN ESTE PERIODO"
                                     paginator="true" paginatorPosition="bottom" rows="10"
                                     styleClass="ui-datatable-striped ui-datatable-sm mt-2"
                                     reflow="true" size="small" tableStyle="table-layout: auto;">

                            <f:facet name="header">
                                <div class="flex flex-column md:flex-row justify-content-between align-items-center">
                                    <h5 class="m-0"><i class="pi pi-list mr-2"></i>Archivos Cargados</h5>
                                    <span class="p-input-icon-left mt-2 md:mt-0">
                                        <i class="pi pi-search" />
                                        <p:inputText id="globalFilter" onkeyup="PF('tblPro').filter()" placeholder="Buscar documento..." style="width: 300px;"/>
                                    </span>
                                </div>
                            </f:facet>

                            <p:column headerText="Cód. Generación" filterBy="#{buy.codigoGeneracion}" filterMatchMode="contains">
                                <p:outputLabel value="#{buy.codigoGeneracion}" styleClass="font-bold text-primary"/>
                            </p:column>

                            <p:column headerText="Fecha Emisión" sortBy="#{buy.fecha}">
                                <p:outputLabel value="#{buy.fecha}"/>
                            </p:column>

                            <p:column headerText="NIT Emisor">
                                <p:outputLabel value="#{buy.nit}"/>
                            </p:column>

                            <p:column headerText="Nombre Emisor" filterBy="#{buy.nombre}" filterMatchMode="contains">
                                <p:outputLabel value="#{buy.nombre}"/>
                            </p:column>

                            <p:column headerText="Monto" sortBy="#{buy.monto}" style="text-align: right;">
                                <p:outputLabel value="#{buy.monto}">
                                    <f:convertNumber pattern="$ #,##0.00"/>
                                </p:outputLabel>
                            </p:column>

                            <p:column headerText="Fecha Carga">
                                <p:outputLabel value="#{buy.fechacrea}">
                                    <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                                </p:outputLabel>
                            </p:column>

                            <p:column headerText="Estado" style="text-align: center;">
                                <p:tag severity="success" value="PROCESADO" rounded="true" />
                            </p:column>

                            <p:column headerText="Acciones" style="text-align: center; width: 80px;">
                                <p:commandButton icon="pi pi-eye" styleClass="rounded-button ui-button-info ui-button-flat"
                                                 action="#{buyView.prepareViewDetail(buy)}" update="dvDetailBuy"
                                                 title="Ver Detalle" process="@this"/>
                            </p:column>

                        </p:dataTable>
                    </div>
                </div>
            </div>

            <!-- Diálogo de Visualización Individual (Solo lectura) -->
            <p:dialog id="dlgViewBuy" widgetVar="dlgViewBuy" header="Detalle de DTE" modal="true" visible="false"
                      responsive="true" width="450" closable="true" draggable="false" maximizable="false" minimizable="false">
                <div class="grid">
                    <div class="col-12 md:col-12" jsf:id="dvDetailBuy">
                        <div class="text-center mb-4">
                            <i class="pi pi-file text-blue-500" style="font-size: 3rem"></i>
                            <h5 class="mt-3">Resumen de Compra</h5>
                        </div>

                        <div class="formgrid grid ui-fluid">
                            <div class="field col-12 border-bottom-1 border-300 pb-2">
                                <p:outputLabel value="Cód. Generación:" styleClass="text-secondary mr-2"/>
                                <p:outputLabel value="#{buyView.codigoGeneracion}" styleClass="font-bold"/>
                            </div>
                            <div class="field col-12 border-bottom-1 border-300 pb-2">
                                <p:outputLabel value="Fecha DTE:" styleClass="text-secondary mr-2"/>
                                <p:outputLabel value="#{buyView.fechEmi}" styleClass="font-bold"/>
                            </div>
                            <div class="field col-12 border-bottom-1 border-300 pb-2">
                                <p:outputLabel value="NIT Emisor:" styleClass="text-secondary mr-2"/>
                                <p:outputLabel value="#{buyView.nitEmisor}" styleClass="font-bold"/>
                            </div>
                            <div class="field col-12 border-bottom-1 border-300 pb-2">
                                <p:outputLabel value="Emisor:" styleClass="text-secondary mr-2"/>
                                <p:outputLabel value="#{buyView.nombreEmisor}" styleClass="font-bold"/>
                            </div>
                            <div class="field col-12 pt-2">
                                <p:outputLabel value="Monto:" styleClass="text-secondary mr-2"/>
                                <p:outputLabel value="#{buyView.monto}" styleClass="font-bold text-xl text-primary">
                                    <f:convertNumber pattern="$ #,##0.00"/>
                                </p:outputLabel>
                            </div>
                        </div>
                    </div>
                </div>
                <f:facet name="footer">
                    <div class="flex justify-content-end">
                        <p:commandButton value="Cerrar" icon="pi pi-times" styleClass="ui-button-flat ui-button-secondary"
                                         onclick="PF('dlgViewBuy').hide();" type="button" />
                    </div>
                </f:facet>
            </p:dialog>
        </h:form>
    </ui:define>
</ui:composition>
